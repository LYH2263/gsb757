services:
  db:
    image: mysql:8.0
    container_name: bookstore_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookstore
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - bookstore_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookstore_backend
    environment:
      DB_URL: jdbc:mysql://db:3306/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - bookstore_net



volumes:
  db_data:

networks:
  bookstore_net:
    driver: bridge
